services:
  policy-hub:
    image: aichenk/family-policy-hub:latest
    # build: . # 本地基于源码构建时可开启
    container_name: family-policy-hub
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    environment:
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-}
      - PORT=8088
      - HOST=0.0.0.0
      - TZ=Asia/Shanghai
    volumes:
      # 持久化映射：保证所有保单数据、历史记录、附件与备份均保存在宿主机
      - ./data:/app/data
